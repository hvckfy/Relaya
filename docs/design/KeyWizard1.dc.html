<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мастер ключа — шаг 1, ключ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.lt{--bg:#FFFFFF;--bg2:#F5F5F7;--line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.06);--tx:#1D1D1F;--tx2:#5F5F64;--acc:#0066CC;--accbg:#0066CC;--acctint:rgba(0,102,204,.1);--sel:rgba(0,0,0,.08);--red:#C4161C;--redtint:rgba(196,22,28,.08);--org:#A84B00;--orgtint:rgba(168,75,0,.1);--grn:#1B7A33;--grntint:rgba(27,122,51,.1);--field:#FFFFFF}
.dk{--bg:#262628;--bg2:#2E2E31;--line:rgba(255,255,255,.13);--line2:rgba(255,255,255,.07);--tx:#F5F5F7;--tx2:#A8A8AE;--acc:#5AA9FF;--accbg:#0B6BD3;--acctint:rgba(90,169,255,.16);--sel:rgba(255,255,255,.1);--red:#FF6B6B;--redtint:rgba(255,107,107,.14);--org:#FFB347;--orgtint:rgba(255,179,71,.14);--grn:#5ED47A;--grntint:rgba(94,212,122,.14);--field:#1E1E20}
.root{font-family:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;color:var(--tx);font-size:13px;-webkit-font-smoothing:antialiased}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 14px;border-radius:6px;border:.5px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:13px;cursor:pointer;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.btn.pri{background:var(--accbg);border-color:transparent;color:#fff}
.field{height:26px;border:.5px solid var(--line);border-radius:5px;background:var(--field);color:var(--tx);padding:0 8px;font:inherit;font-size:13px;box-sizing:border-box}
a{color:var(--acc)}a:hover{color:var(--acc)}
</style>
</helmet>
<div class="root {{theme}}" role="dialog" aria-label="Настроить вход по ключу" style="width: 680px; height: 620px; display: flex; flex-direction: column; background: var(--bg); border-radius: 12px; overflow: hidden; box-sizing: border-box; border: 0.5px solid var(--line)">
  <header style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 17px; font-weight: 700">Настроить вход по ключу</h1>
    <p style="margin: 0; color: var(--tx2)">Хост <span class="mono" style="color: var(--tx)">ubuntu@staging.example.com</span></p>
  </header>
  <ol aria-label="Шаги" style="list-style: none; margin: 18px 24px 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <li style="display: flex; flex-direction: column; gap: 6px">
        <span style="height: 3px; border-radius: 2px; background: {{s.bar}}"></span>
        <span style="font-size: 12px; font-weight: {{s.weight}}; color: {{s.color}}">{{s.n}}. {{s.label}}</span>
      </li>
    </sc-for>
  </ol>

  <main style="flex: 1; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px">
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-weight: 600; margin-bottom: 8px; padding: 0">Ключ</legend>
      <label style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--acc); background: var(--acctint)">
        <input type="radio" name="k" checked>
        <span style="flex: 1">Создать новый <b>ed25519</b></span>
        <span style="font-size: 11px; font-weight: 600; color: var(--grn); background: var(--grntint); padding: 2px 7px; border-radius: 4px">Рекомендуется</span>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 0.5px solid var(--line)">
        <input type="radio" name="k">
        <span style="flex: 1">Использовать существующий</span>
        <select class="field" disabled style="width: 220px; opacity: .6"><option>id_ed25519 (5 хостов)</option></select>
      </label>
    </fieldset>

    <div style="display: grid; grid-template-columns: 150px 1fr; gap: 10px 14px; align-items: center">
      <label for="kw-file" style="text-align: right; color: var(--tx2)">Имя файла</label>
      <input id="kw-file" class="field mono" value="~/.ssh/id_ed25519_staging-web">
      <label for="kw-comment" style="text-align: right; color: var(--tx2)">Комментарий</label>
      <input id="kw-comment" class="field" value="heckfy@macbook-air · staging-web">
      <label for="kw-pass" style="text-align: right; color: var(--tx2)">Passphrase</label>
      <div style="display: flex; align-items: center; gap: 12px">
        <input id="kw-pass" type="password" class="field" placeholder="Необязательно" style="flex: 1">
        <label style="display: flex; align-items: center; gap: 6px; white-space: nowrap"><input type="checkbox" checked>Сохранить в Keychain</label>
      </div>
      <span></span>
      <label style="display: flex; align-items: flex-start; gap: 8px">
        <input type="checkbox" style="margin-top: 2px">
        <span style="display: flex; flex-direction: column; gap: 2px"><span>Хранить в Secure Enclave</span><span style="font-size: 12px; color: var(--tx2)">Ключ не покидает чип. Доступно на этом Mac.</span></span>
      </label>
    </div>

    <p style="margin: auto 0 0; font-size: 12px; color: var(--tx2); display: flex; gap: 6px; align-items: center">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5M12 8h.01"/></svg>
      На следующем шаге покажем все изменения до того, как что-то будет записано.
    </p>
  </main>

  <footer style="display: flex; align-items: center; gap: 8px; padding: 14px 24px; border-top: 0.5px solid var(--line)">
    <button class="btn">Отмена</button>
    <span style="flex: 1"></span>
    <a class="btn pri" href="KeyWizard2.dc.html">Далее</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":680,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 1;
    const labels = ['Ключ', 'Превью', 'Применение', 'Готово'];
    return {
      theme: this.props.dark ? 'dk' : 'lt',
      steps: labels.map((label, i) => ({
        n: i + 1, label,
        bar: i + 1 <= cur ? 'var(--acc)' : 'var(--line)',
        color: i + 1 === cur ? 'var(--tx)' : 'var(--tx2)',
        weight: i + 1 === cur ? 600 : 400
      }))
    };
  }
}
</script>
</body>
</html>
