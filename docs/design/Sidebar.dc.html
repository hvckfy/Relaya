<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Relaya — sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<aside aria-label="Хосты" style="width: 260px; height: 800px; flex-shrink: 0; display: flex; flex-direction: column; box-sizing: border-box; background: var(--side, #ECECEF); border-right: 0.5px solid var(--line, rgba(0,0,0,.12)); font-family: -apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', sans-serif; font-size: 13px; color: var(--tx, #1D1D1F)">
  <div style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; flex-shrink: 0" aria-hidden="true">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 8px; display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 6px; padding: 10px 8px 4px; font-size: 11px; font-weight: 600; color: var(--tx2, #5F5F64)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{sec.icon}}"/></svg>
        <span>{{sec.title}}</span>
      </div>
      <sc-for list="{{sec.rows}}" as="h" hint-placeholder-count="2">
        <sc-if value="{{h.isGroup}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; color: var(--tx, #1D1D1F)">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--tx2, #5F5F64)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{h.chev}}"/></svg>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acc, #0066CC)" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"/></svg>
            <span style="flex: 1">{{h.alias}}</span>
            <span style="font-size: 11px; color: var(--tx2, #5F5F64)">{{h.count}}</span>
          </div>
        </sc-if>
        <sc-if value="{{h.isHost}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 {{h.indent}}px; border-radius: 6px; {{h.rowStyle}}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--tx2, #5F5F64)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="{{h.protoLabel}}" role="img"><path d="{{h.icon}}"/></svg>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2">
              <span style="display: flex; align-items: center; gap: 5px; font-weight: 500">{{h.alias}}<span style="width: 6px; height: 6px; border-radius: 50%; background: {{h.envColor}}" aria-label="{{h.env}}" role="img"></span></span>
              <span style="font-size: 11px; color: var(--tx2, #5F5F64); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.sub}}</span>
            </div>
            <sc-if value="{{h.pw}}" hint-placeholder-val="{{false}}">
              <span title="Вход по паролю — настройте ключ" style="display: inline-flex; color: var(--org, #A84B00)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Вход по паролю"><path d="M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            </sc-if>
            <span style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid {{h.statusBorder}}; background: {{h.statusFill}}" role="img" aria-label="{{h.statusLabel}}"></span>
          </div>
        </sc-if>
      </sc-for>
    </sc-for>
  </div>

  <div style="padding: 8px; border-top: 0.5px solid var(--line, rgba(0,0,0,.12)); display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px; {{n.rowStyle}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--acc, #0066CC)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"/></svg>
        <span style="flex: 1">{{n.label}}</span>
        <span style="font-size: 11px; color: var(--tx2, #5F5F64)">{{n.meta}}</span>
      </div>
    </sc-for>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["staging-web","prod-api-1","db-main","win-build","mac-mini","keys","tunnels","agents","none"],"default":"staging-web"},"$preview":{"width":260,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'staging-web';
    const I = {
      ssh: 'M4 17l6-5-6-5M12 19h8',
      vnc: 'M3 5h18v11H3zM8 20h8M12 16v4',
      rdp: 'M3 5h18v11H3zM8 20h8M12 16v4',
      star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
      clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
      folder: 'M3 6h6l2 2h10v11H3z',
      key: 'M14.5 4a5.5 5.5 0 1 1-4.9 8L3 18.6V21h3v-2h2v-2h2l1.6-1.6A5.5 5.5 0 0 1 14.5 4zM16 8h.01',
      tun: 'M7 7h13l-3-3M17 17H4l3 3',
      agent: 'M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8zM19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z'
    };
    const envColor = { prod: 'var(--red, #C4161C)', staging: 'var(--org, #A84B00)', dev: 'var(--grn, #1B7A33)' };
    const H = {
      'prod-api-1': { alias: 'prod-api-1', sub: 'deploy@10.0.1.12', proto: 'ssh', env: 'prod', on: true },
      'prod-api-2': { alias: 'prod-api-2', sub: 'deploy@10.0.1.13', proto: 'ssh', env: 'prod', on: false },
      'db-main': { alias: 'db-main', sub: 'postgres@db.internal', proto: 'ssh', env: 'prod', on: true },
      'staging-web': { alias: 'staging-web', sub: 'ubuntu@staging.example.com', proto: 'ssh', env: 'staging', on: true, pw: true },
      'win-build': { alias: 'win-build', sub: 'Administrator@192.168.1.40', proto: 'rdp', env: 'dev', on: false },
      'mac-mini': { alias: 'mac-mini', sub: 'heckfy@mac-mini.local', proto: 'vnc', env: 'dev', on: false }
    };
    const host = (id, indent) => {
      const h = H[id];
      return {
        ...h, isHost: true, isGroup: false, pw: !!h.pw, indent: indent || 8,
        icon: I[h.proto], protoLabel: h.proto.toUpperCase(), envColor: envColor[h.env],
        rowStyle: id === active ? 'background: var(--sel, rgba(0,0,0,.08));' : '',
        statusBorder: h.on ? 'var(--grn, #1B7A33)' : 'var(--tx2, #5F5F64)',
        statusFill: h.on ? 'var(--grn, #1B7A33)' : 'transparent',
        statusLabel: h.on ? 'подключён' : 'не подключён'
      };
    };
    const group = (name, count, open) => ({ isGroup: true, isHost: false, alias: name, count, chev: open ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6' });
    const navRow = (id, label, icon, meta) => ({ label, icon, meta, rowStyle: id === active ? 'background: var(--sel, rgba(0,0,0,.08));' : '' });
    return {
      sections: [
        { title: 'Избранное', icon: I.star, rows: [host('prod-api-1'), host('db-main')] },
        { title: 'Недавние', icon: I.clock, rows: [host('staging-web'), host('win-build')] },
        { title: 'Группы', icon: I.folder, rows: [
          group('prod', 3, true), host('prod-api-1', 26), host('prod-api-2', 26), host('db-main', 26),
          group('staging', 3, false),
          group('dev', 2, true), host('win-build', 26), host('mac-mini', 26)
        ] }
      ],
      nav: [
        navRow('keys', 'Ключи', I.key, '5'),
        navRow('tunnels', 'Туннели', I.tun, '2 акт.'),
        navRow('agents', 'Агенты (MCP)', I.agent, 'вкл')
      ]
    };
  }
}
</script>
</body>
</html>
