[package]
name = "relaya-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Relaya core: ~/.ssh/config, sync, MCP policy and other platform-independent logic shared by the macOS and Windows clients."

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "relaya_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
# Общие типы удалённых столов (RDP-сессия, слушатели, доверие к сертификатам). Сам RDP — rdp-freerdp.
remote-desktop = []
# RDP на FreeRDP 3 вместо IronRDP под тем же API. Нужна собранная FreeRDP: FREERDP_DIR с include/ и lib/
# (артефакт workflow freerdp.yml); прослойка native/relaya_rdp.c собирается крейтом cc.
rdp-freerdp = ["remote-desktop", "dep:cc"]
# VNC на RoyalVNCKit (MIT) через её C API. Нужна собранная библиотека: ROYALVNC_DIR с libRoyalVNCKit.so или
# RoyalVNCKit.lib/.dll (.github/actions/royalvnc).
vnc-royal = ["remote-desktop"]

[dependencies]
uniffi = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
alacritty_terminal = "0.25"
regex = "1"
glob = "0.3"
thiserror = "1"
chacha20poly1305 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
