[package]
name = "relaya-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Relaya core: ~/.ssh/config, sync, MCP policy and other platform-independent logic shared by the macOS and Windows clients."

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "relaya_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
glob = "0.3"
thiserror = "1"
chacha20poly1305 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
