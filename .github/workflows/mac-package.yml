name: Mac package

# Builds the signed ru/en app zips for release.yml (artifact release-macos); release.yml publishes them.
# Signing uses the persistent self-signed certificate from SIGNING_P12_BASE64 / SIGNING_P12_PASSWORD, so every
# version keeps one identity and Keychain "Always Allow" grants survive updates. Without secrets: ad-hoc.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: "Mac · package"
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        # SDK macOS 26 — для Liquid Glass. Берём самый новый Xcode 26 из образа.
        run: |
          printf '%s\n' /Applications/Xcode*.app
          XC=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # FreeRDP 3 для встроенного RDP (ядро с rdp-freerdp): dylib обеих архитектур, кэш vcpkg в действии.
      - name: FreeRDP arm64
        id: freerdp_arm
        uses: ./.github/actions/freerdp
        with:
          triplet: arm64-osx-dynamic
      - name: FreeRDP x86_64
        id: freerdp_x64
        uses: ./.github/actions/freerdp
        with:
          triplet: x64-osx-dynamic

      # RoyalVNCKit (VNC ядра, feature vnc-royal): universal dylib для macOS 15.
      - name: RoyalVNCKit
        id: royalvnc
        uses: ./.github/actions/royalvnc

      - name: Build Rust core (universal static library + Swift bindings)
        uses: ./.github/actions/build-core
        env:
          FREERDP_DIR_ARM64: ${{ steps.freerdp_arm.outputs.dir }}
          FREERDP_DIR_X64: ${{ steps.freerdp_x64.outputs.dir }}
          ROYALVNC_DIR: ${{ steps.royalvnc.outputs.dir }}
        with:
          script: scripts/build-core-macos.sh
      # ADR-002: two builds, Russian and English; the language is fixed in the bundle (the second run reuses SwiftPM).
      # Dry runs (PR, manual) are 0.0.0, like windows.yml and linux.yml.
      - name: Build app bundles (ru, en)
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          scripts/bundle-macos.sh "$version" ru
          scripts/bundle-macos.sh "$version" en

      - name: Sign
        env:
          P12: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No signing certificate in secrets, signing ad-hoc"
            for l in ru en; do codesign --force --deep --sign - "build/$l/Relaya.app"; done
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/relaya.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/relaya.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          # shellcheck disable=SC2046 # the keychain list is meant to split into arguments
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Самоподписанный сертификат не доверенный — ищем по SHA-1, а не по имени среди «валидных».
          HASH=$(security find-certificate -c "Relaya Self-Signed" -Z "$KC" | awk '/SHA-1/{print $NF}')
          for l in ru en; do
            codesign --force --deep --keychain "$KC" --sign "$HASH" "build/$l/Relaya.app"
            codesign -dvv "build/$l/Relaya.app" 2>&1 | grep -E "Authority|Identifier|Signature"
          done
          rm -f "$RUNNER_TEMP/relaya.p12"

      - name: Package
        run: |
          for l in ru en; do ditto -c -k --keepParent "build/$l/Relaya.app" "build/Relaya-macos-$l.zip"; done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: build/Relaya-macos-*.zip
          if-no-files-found: error
