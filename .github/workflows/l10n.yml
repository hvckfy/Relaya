name: Localization

# Каждая строка интерфейса (L("…") в Swift и C#) должна быть в en.lproj, без дублей и с тем же числом %@.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: l10n-${{ github.ref }}
  # Один прогон на ветку: новый push отменяет устаревший (проверяется последний коммит, очередь не копится).
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/check-l10n.py
