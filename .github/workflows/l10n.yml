name: Localization

# Every UI string (L("…") in Swift and C#) must be in en.lproj, without duplicates and with the same number of %@.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: l10n-${{ github.ref }}
  # One run per branch finishes; of the newer ones only the latest waits (GitHub replaces the pending one),
  # so frequent pushes do not cancel the check and the queue does not grow.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: "Localization · translations"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I scripts/check-l10n.py
