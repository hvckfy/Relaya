name: Linux

# main: core, pty smoke test, the Uno app and packages (AppImage, .deb) as an artifact. Releases come from release.yml.
on:
  push:
    branches: [main]
    # Own files only: a commit for another platform neither starts nor cancels this run. Tags go to release.yml.
    paths:
      - "apps/dotnet/**"
      - "core/**"
      - "resources/**"
      - "scripts/*linux*"
      - ".github/actions/build-core/**"
      - ".github/workflows/linux.yml"
  pull_request:
  # release.yml builds the release packages from here.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  # One run per branch finishes; of the newer ones only the latest waits (GitHub replaces the pending one),
  # so frequent pushes do not cancel the check and the queue does not grow.
  cancel-in-progress: false

jobs:
  build:
    name: "Linux · build (${{ matrix.lang }})"
    # 24.04: the Swift toolchain for RoyalVNCKit is built for it (libxml2.so.2).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Two builds, as on Mac and Windows (ADR-002): the UI language is fixed at build time.
    strategy:
      fail-fast: false
      matrix:
        lang: [ru, en]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # NuGet cache; the cargo cache lives in the build-core action.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/dotnet/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # RDP on FreeRDP 3 from vcpkg with our overlay (OpenH264 by path), as on Mac and Windows: the action sets FREERDP_DIR,
      # the core script builds with rdp-freerdp and puts the FreeRDP .so next to the core. First build ~25 minutes, then cached.
      - name: FreeRDP
        uses: ./.github/actions/freerdp
        with:
          triplet: x64-linux-dynamic
      # VNC on RoyalVNCKit (.so with -static-stdlib): the core script enables vnc-royal and puts it next to the core.
      - name: RoyalVNCKit
        uses: ./.github/actions/royalvnc
      - name: Build Rust core + C# bindings
        uses: ./.github/actions/build-core
        with:
          script: scripts/build-core-linux.sh
      # pty: output, controlling terminal, window size, input, ssh from PATH.
      - name: pty smoke test
        run: dotnet run --project apps/dotnet/Relaya.Linux.Smoke -c Release
      # Unit tests of the pure Shared logic (formatters, the ssh password prompt), the same as in windows.yml.
      - name: Shared unit tests
        if: matrix.lang == 'en'
        run: dotnet test apps/dotnet/Relaya.Shared.Tests -c Release
      - name: Build Uno app
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          dotnet publish apps/dotnet/Relaya.Linux/Relaya.Linux.csproj -c Release -f net10.0-desktop -r linux-x64 \
            --self-contained -p:Version="$version" -p:RelayaLang=${{ matrix.lang }} -o build/relaya-linux-x64-${{ matrix.lang }}
      - name: Package AppImage and .deb
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick >/dev/null
          export APPIMAGE_EXTRACT_AND_RUN=1  # no FUSE on the runner
          # Pinned release and hash: an unpinned "continuous" build would run unchecked code in the release.
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" scripts/package-linux.sh build/relaya-linux-x64-${{ matrix.lang }} "$version" ${{ matrix.lang }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.lang }}
          path: |
            build/Relaya-*.AppImage
            build/relaya_*.deb
          if-no-files-found: error

