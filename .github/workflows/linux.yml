name: Linux

# Ветка main — ядро, pty smoke, приложение на Uno и пакеты (AppImage, .deb) артефактом; тег v* — ещё и в GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Только свои файлы: коммит другой платформы не запускает и не отменяет этот прогон (теги — всегда).
    paths:
      - "apps/dotnet/**"
      - "core/**"
      - "resources/**"
      - "scripts/*linux*"
      - ".github/workflows/linux.yml"
  pull_request:

# Права на запись — только у job release (Т6).
permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  # Один прогон на ветку: новый push отменяет устаревший (проверяется последний коммит, очередь не копится).
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      # Кэш cargo и NuGet (Т5): ядро и Uno не собираются с нуля каждый прогон.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            core/target
            ~/.nuget/packages
          key: linux-${{ hashFiles('core/Cargo.lock', 'apps/dotnet/**/*.csproj') }}
          restore-keys: linux-
      - name: Build Rust core + C# bindings
        run: scripts/build-core-linux.sh
      # pty: вывод, управляющий терминал, размер окна, ввод, ssh из PATH.
      - name: pty smoke test
        run: dotnet run --project apps/dotnet/Relaya.Linux.Smoke -c Release
      - name: Build Uno app
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          dotnet publish apps/dotnet/Relaya.Linux/Relaya.Linux.csproj -c Release -f net10.0-desktop -r linux-x64 \
            --self-contained -p:Version=$version -o build/relaya-linux-x64
      - name: Package AppImage and .deb
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick >/dev/null
          export APPIMAGE_EXTRACT_AND_RUN=1  # без FUSE на раннере
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" scripts/package-linux.sh build/relaya-linux-x64 "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Relaya-linux-x64
          path: |
            build/Relaya-*.AppImage
            build/relaya_*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Relaya-linux-x64
          path: build
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Релиз мог создать параллельный workflow (Mac, Windows): после неудачного create проверяем ещё раз и падаем с текстом.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null || { echo "::error::не удалось создать релиз $GITHUB_REF_NAME"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" build/Relaya-*.AppImage build/relaya_*.deb --clobber
