name: Linux

# Ветка main — ядро, pty smoke, приложение на Uno и пакеты (AppImage, .deb) артефактом; тег v* — ещё и в GitHub Release.
on:
  push:
    branches: [main]
    # Own files only: a commit for another platform neither starts nor cancels this run. Tags go to release.yml.
    paths:
      - "apps/dotnet/**"
      - "core/**"
      - "resources/**"
      - "scripts/*linux*"
      - ".github/actions/build-core/**"
      - ".github/workflows/linux.yml"
  pull_request:
  # release.yml builds the release packages from here.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  # Один прогон на ветку доходит до конца; из новых ждёт только самый свежий (GitHub заменяет ожидающий),
  # так проверка не отменяется частыми пушами, а очередь не копится.
  cancel-in-progress: false

jobs:
  build:
    name: "Linux · build (${{ matrix.lang }})"
    # 24.04: toolchain Swift для RoyalVNCKit собран под неё (libxml2.so.2).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Две сборки, как у Mac и Windows (ADR-002): язык интерфейса задаётся при сборке.
    strategy:
      fail-fast: false
      matrix:
        lang: [ru, en]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      # NuGet cache; the cargo cache lives in the build-core action.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/dotnet/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # RDP на FreeRDP 3 из vcpkg с нашим overlay (OpenH264 по пути), как на Mac и Windows: action выставит FREERDP_DIR,
      # скрипт ядра соберёт с rdp-freerdp и положит .so FreeRDP рядом с ядром. Первая сборка ~25 минут, дальше кэш.
      - name: FreeRDP
        uses: ./.github/actions/freerdp
        with:
          triplet: x64-linux-dynamic
      # VNC на RoyalVNCKit (.so с -static-stdlib): скрипт ядра включит vnc-royal и положит её рядом с ядром.
      - name: RoyalVNCKit
        uses: ./.github/actions/royalvnc
      - name: Build Rust core + C# bindings
        uses: ./.github/actions/build-core
        with:
          script: scripts/build-core-linux.sh
      # pty: вывод, управляющий терминал, размер окна, ввод, ssh из PATH.
      - name: pty smoke test
        run: dotnet run --project apps/dotnet/Relaya.Linux.Smoke -c Release
      # Unit-тесты чистой логики Shared (форматтеры, запрос пароля ssh) — те же, что в windows.yml.
      - name: Shared unit tests
        if: matrix.lang == 'en'
        run: dotnet test apps/dotnet/Relaya.Shared.Tests -c Release
      - name: Build Uno app
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          dotnet publish apps/dotnet/Relaya.Linux/Relaya.Linux.csproj -c Release -f net10.0-desktop -r linux-x64 \
            --self-contained -p:Version="$version" -p:RelayaLang=${{ matrix.lang }} -o build/relaya-linux-x64-${{ matrix.lang }}
      - name: Package AppImage and .deb
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick >/dev/null
          export APPIMAGE_EXTRACT_AND_RUN=1  # без FUSE на раннере
          # Pinned release and hash: an unpinned "continuous" build would run unchecked code in the release.
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" scripts/package-linux.sh build/relaya-linux-x64-${{ matrix.lang }} "$version" ${{ matrix.lang }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ matrix.lang }}
          path: |
            build/Relaya-*.AppImage
            build/relaya_*.deb
          if-no-files-found: error

