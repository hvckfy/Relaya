name: Linux

# Ветка main — ядро, pty smoke, приложение на Uno и пакеты (AppImage, .deb) артефактом; тег v* — ещё и в GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Права на запись — только у job release (Т6).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Кэш cargo и NuGet (Т5): ядро и Uno не собираются с нуля каждый прогон.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            core/target
            ~/.nuget/packages
          key: linux-${{ hashFiles('core/Cargo.lock', 'apps/dotnet/**/*.csproj') }}
          restore-keys: linux-
      - name: Build Rust core + C# bindings
        run: scripts/build-core-linux.sh
      # pty: вывод, управляющий терминал, размер окна, ввод, ssh из PATH.
      - name: pty smoke test
        run: dotnet run --project apps/dotnet/Relaya.Linux.Smoke -c Release
      - name: Build Uno app
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          dotnet publish apps/dotnet/Relaya.Linux/Relaya.Linux.csproj -c Release -f net10.0-desktop -r linux-x64 \
            --self-contained -p:Version=$version -o build/relaya-linux-x64
      - name: Package AppImage and .deb
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          sudo apt-get install -y -qq imagemagick >/dev/null
          export APPIMAGE_EXTRACT_AND_RUN=1  # без FUSE на раннере
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" scripts/package-linux.sh build/relaya-linux-x64 "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: Relaya-linux-x64
          path: |
            build/Relaya-*.AppImage
            build/relaya_*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Relaya-linux-x64
          path: build
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Релиз мог создать параллельный workflow (Mac, Windows): после неудачного create проверяем ещё раз и падаем с текстом.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null || { echo "::error::не удалось создать релиз $GITHUB_REF_NAME"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" build/Relaya-*.AppImage build/relaya_*.deb --clobber
