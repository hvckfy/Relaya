name: Linux

# Ветка main — ядро, pty smoke и сборка приложения на Uno; пакеты (AppImage, .deb) — следующим шагом.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Rust core + C# bindings
        run: scripts/build-core-linux.sh
      # pty: вывод, управляющий терминал, размер окна, ввод, ssh из PATH.
      - name: pty smoke test
        run: dotnet run --project apps/dotnet/Relaya.Linux.Smoke -c Release
      - name: Build Uno app
        run: |
          version=0.0.0
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then version="${BASH_REMATCH[1]}"; fi
          dotnet publish apps/dotnet/Relaya.Linux/Relaya.Linux.csproj -c Release -f net10.0-desktop -r linux-x64 \
            --self-contained -p:Version=$version -o build/relaya-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Relaya-linux-x64
          path: build/relaya-linux-x64/
