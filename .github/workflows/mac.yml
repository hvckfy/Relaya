name: Mac

on:
  # Branches are checked through PRs: push on any branch plus pull_request ran the Mac build twice.
  push:
    branches: [main]
    # Own files only: a commit for another platform neither starts nor cancels this run. Tags go to release.yml.
    paths:
      - "apps/swift/**"
      - "core/**"
      - "resources/**"
      - "scripts/*macos*"
      - ".github/actions/freerdp/**"
      - ".github/actions/royalvnc/**"
      - ".github/actions/build-core/**"
      - ".github/workflows/mac.yml"
  pull_request:

concurrency:
  group: mac-${{ github.ref }}
  # One run per branch finishes; of the newer ones only the latest waits (GitHub replaces the pending one),
  # so frequent pushes do not cancel the check and the queue does not grow.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-test:
    name: "Mac · build and test"
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        # The macOS 26 SDK is for Liquid Glass. Take the newest Xcode 26 on the image.
        run: |
          printf '%s\n' /Applications/Xcode*.app
          XC=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # FreeRDP 3 for the built-in RDP (core with rdp-freerdp): dylibs for both architectures, vcpkg cache in the action.
      - name: FreeRDP arm64
        id: freerdp_arm
        uses: ./.github/actions/freerdp
        with:
          triplet: arm64-osx-dynamic
      - name: FreeRDP x86_64
        id: freerdp_x64
        uses: ./.github/actions/freerdp
        with:
          triplet: x64-osx-dynamic

      # RoyalVNCKit (the core's VNC, feature vnc-royal): a universal dylib for macOS 15.
      - name: RoyalVNCKit
        id: royalvnc
        uses: ./.github/actions/royalvnc

      - name: Build Rust core (universal static library + Swift bindings)
        uses: ./.github/actions/build-core
        env:
          FREERDP_DIR_ARM64: ${{ steps.freerdp_arm.outputs.dir }}
          FREERDP_DIR_X64: ${{ steps.freerdp_x64.outputs.dir }}
          ROYALVNC_DIR: ${{ steps.royalvnc.outputs.dir }}
        with:
          script: scripts/build-core-macos.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/swift/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/swift/Package.resolved', 'apps/swift/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build
        working-directory: apps/swift

      - name: Test
        run: swift test
        working-directory: apps/swift
