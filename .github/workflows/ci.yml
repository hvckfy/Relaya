name: CI

on:
  push:
    branches: ["**"]
    # Только свои файлы: коммит другой платформы не запускает и не отменяет этот прогон (теги — всегда).
    paths:
      - "apps/swift/**"
      - "core/**"
      - "resources/**"
      - "scripts/*macos*"
      - ".github/actions/freerdp/**"
      - ".github/actions/royalvnc/**"
      - ".github/workflows/ci.yml"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Один прогон на ветку доходит до конца; из новых ждёт только самый свежий (GitHub заменяет ожидающий),
  # так проверка не отменяется частыми пушами, а очередь не копится.
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        # SDK macOS 26 — для Liquid Glass. Берём самый новый Xcode 26 из образа.
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # FreeRDP 3 для встроенного RDP (ядро с rdp-freerdp): dylib обеих архитектур, кэш vcpkg в действии.
      - name: FreeRDP arm64
        id: freerdp_arm
        uses: ./.github/actions/freerdp
        with:
          triplet: arm64-osx-dynamic
      - name: FreeRDP x86_64
        id: freerdp_x64
        uses: ./.github/actions/freerdp
        with:
          triplet: x64-osx-dynamic

      # RoyalVNCKit (VNC ядра, feature vnc-royal): universal dylib для macOS 15.
      - name: RoyalVNCKit
        id: royalvnc
        uses: ./.github/actions/royalvnc

      - name: Build Rust core (universal static library + Swift bindings)
        env:
          FREERDP_DIR_ARM64: ${{ steps.freerdp_arm.outputs.dir }}
          FREERDP_DIR_X64: ${{ steps.freerdp_x64.outputs.dir }}
          ROYALVNC_DIR: ${{ steps.royalvnc.outputs.dir }}
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          scripts/build-core-macos.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/swift/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/swift/Package.resolved', 'apps/swift/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build
        working-directory: apps/swift

      - name: Test
        run: swift test
        working-directory: apps/swift
