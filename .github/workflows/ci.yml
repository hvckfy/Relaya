name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # На main не отменяем: туда пушат несколько агентов, и у каждого коммита должен быть полный прогон.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # SDK macOS 26 — для Liquid Glass. Берём самый новый Xcode 26 из образа.
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build Rust core (universal static library + Swift bindings)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          scripts/build-core-macos.sh
      - uses: actions/cache@v4
        with:
          path: apps/swift/.build
          key: spm-${{ runner.os }}-${{ hashFiles('apps/swift/Package.resolved', 'apps/swift/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build
        working-directory: apps/swift

      - name: Test
        run: swift test
        working-directory: apps/swift
