name: Core · benchmarks

# Core hot-path timings (core/benches/core.rs). A push to main appends the result to the public history on the
# gh-pages branch (dev/bench); a PR is compared with that history and reports a 2x slowdown without failing.
on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/perf.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/perf.yml"]

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs the PR's code, so it holds a read-only token and does not keep it in .git/config.
  bench:
    name: "Core · benchmarks"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: perf-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml') }}
          restore-keys: perf-${{ runner.os }}-
      - name: Run benchmarks
        working-directory: core
        shell: bash # pipefail: a failed cargo bench must not hide behind tee
        run: cargo bench --locked --bench core | tee "$RUNNER_TEMP/bench.json"
      - uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Relaya core
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/bench.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ github.token }}
          auto-push: false
          save-data-file: false
          # Hosted runners are noisy: report only until the history shows a sane threshold.
          alert-threshold: "200%"
          fail-on-alert: false
          summary-always: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: ${{ runner.temp }}/bench.json

  # Main only, no project code runs here: appends the measured result to the gh-pages history.
  history:
    name: "Core · benchmark history"
    needs: bench
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # pushes to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench
          path: ${{ runner.temp }}
      - uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Relaya core
          tool: customSmallerIsBetter
          output-file-path: ${{ runner.temp }}/bench.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ github.token }}
          auto-push: true
          save-data-file: true
          fail-on-alert: false
