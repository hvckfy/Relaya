name: Lint

# Linters that build nothing: workflows (actionlint), shell scripts (shellcheck), Swift (swift-format),
# C# (dotnet format).
# Rust clippy and rustfmt run in core.yml.

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "scripts/**"
      - "apps/swift/**"
      - "apps/dotnet/**"
      - ".swift-format"
  pull_request:
    paths:
      - ".github/**"
      - "scripts/**"
      - "apps/swift/**"
      - "apps/dotnet/**"
      - ".swift-format"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflows:
    name: "Lint · workflows (actionlint)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # actionlint 1.7.12: the release binary, checked against a pinned sha256 (no download scripts).
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  scripts:
    name: "Lint · shell scripts (shellcheck)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # shellcheck ships with the ubuntu-24.04 image.
      - name: shellcheck
        run: shellcheck --version && shellcheck scripts/*.sh

  swift:
    name: "Lint · Swift (swift-format)"
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # swift-format ships with Xcode; take the newest Xcode 26, the same one mac.yml builds with.
      - name: swift-format
        run: |
          XC=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcrun swift-format --version
          xcrun swift-format lint --strict --recursive --configuration .swift-format apps/swift/Sources apps/swift/Tests apps/swift/Package.swift

  dotnet:
    name: "Lint · C# (dotnet format)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      # Whitespace only, by folder: needs no restore or WinUI, so it runs on Linux for both clients.
      - name: dotnet format
        run: dotnet format whitespace apps/dotnet --folder --verify-no-changes -v diag || { dotnet format whitespace apps/dotnet --folder; git diff > dotnet-format.diff; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotnet-format-diff
          path: dotnet-format.diff
          if-no-files-found: ignore
