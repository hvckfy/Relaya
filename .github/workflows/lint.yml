name: Lint

# Linters that build nothing: workflows (actionlint), shell scripts (shellcheck), Swift (swift-format).
# Rust clippy and rustfmt run in core.yml.

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "scripts/**"
      - "apps/swift/**"
      - ".swift-format"
  pull_request:
    paths:
      - ".github/**"
      - "scripts/**"
      - "apps/swift/**"
      - ".swift-format"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflows:
    name: "Lint · workflows (actionlint)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # actionlint 1.7.12 — бинарь релиза, сверка sha256 с закреплённым значением (без скриптов загрузки).
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  scripts:
    name: "Lint · shell scripts (shellcheck)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # shellcheck есть в образе ubuntu-24.04.
      - name: shellcheck
        run: shellcheck --version && shellcheck scripts/*.sh

  swift:
    name: "Lint · Swift (swift-format)"
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # swift-format ships with Xcode; take the newest Xcode 26, the same one mac.yml builds with.
      - name: swift-format
        run: |
          XC=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcrun swift-format --version
          xcrun swift-format lint --strict --recursive --configuration .swift-format apps/swift/Sources apps/swift/Tests apps/swift/Package.swift
