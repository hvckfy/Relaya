name: Release

# Тег вида v0.1.0 → собранный Relaya.zip в GitHub Release.
# Подпись — постоянным самоподписанным сертификатом из секретов SIGNING_P12_BASE64 / SIGNING_P12_PASSWORD:
# у всех версий одна «личность», поэтому разрешения Keychain («Разрешать всегда») не сбрасываются после обновления.
# Без секретов — ad-hoc. Нотаризации нет: при первом запуске macOS попросит подтвердить открытие.
on:
  push:
    tags: ["v*"]
  # Ручной прогон сборки без публикации (проверка ветки).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # SDK macOS 26 — для Liquid Glass. Берём самый новый Xcode 26 из образа.
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # FreeRDP 3 для встроенного RDP (ядро с rdp-freerdp): dylib обеих архитектур, кэш vcpkg в действии.
      - name: FreeRDP arm64
        id: freerdp_arm
        uses: ./.github/actions/freerdp
        with:
          triplet: arm64-osx-dynamic
      - name: FreeRDP x86_64
        id: freerdp_x64
        uses: ./.github/actions/freerdp
        with:
          triplet: x64-osx-dynamic

      - name: Build Rust core (universal static library + Swift bindings)
        env:
          FREERDP_DIR_ARM64: ${{ steps.freerdp_arm.outputs.dir }}
          FREERDP_DIR_X64: ${{ steps.freerdp_x64.outputs.dir }}
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          scripts/build-core-macos.sh
      # ADR-002: две сборки — русская и английская; язык зашит в бандл (второй прогон берёт кэш SwiftPM).
      - name: Build app bundles (ru, en)
        run: |
          scripts/bundle-macos.sh "${GITHUB_REF_NAME#v}" ru
          scripts/bundle-macos.sh "${GITHUB_REF_NAME#v}" en

      - name: Sign
        env:
          P12: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No signing certificate in secrets, signing ad-hoc"
            for l in ru en; do codesign --force --deep --sign - "build/$l/Relaya.app"; done
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/relaya.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/relaya.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Самоподписанный сертификат не доверенный — ищем по SHA-1, а не по имени среди «валидных».
          HASH=$(security find-certificate -c "Relaya Self-Signed" -Z "$KC" | awk '/SHA-1/{print $NF}')
          for l in ru en; do
            codesign --force --deep --keychain "$KC" --sign "$HASH" "build/$l/Relaya.app"
            codesign -dvv "build/$l/Relaya.app" 2>&1 | grep -E "Authority|Identifier|Signature"
          done
          rm -f "$RUNNER_TEMP/relaya.p12"

      - name: Package
        run: |
          for l in ru en; do ditto -c -k --keepParent "build/$l/Relaya.app" "build/Relaya-${GITHUB_REF_NAME}-macos-$l.zip"; done

      - name: Upload build (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Relaya-test-build
          path: build/Relaya-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Windows-сборка (windows.yml) кладёт свой zip в тот же релиз — кто первый, тот и создаёт.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" build/Relaya-${GITHUB_REF_NAME}-macos-*.zip --clobber
