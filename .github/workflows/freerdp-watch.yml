name: FreeRDP watch

# Weekly: is there a new FreeRDP release, and are there advisories for the pinned version.
# One GitHub API request and one OSV request; news opens an issue labelled security.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: "FreeRDP · new release check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare with latest release and OSV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(tr -d ' \n' < core/native/freerdp.version)
          latest=$(gh api repos/FreeRDP/FreeRDP/releases/latest -q .tag_name)
          vulns=$(curl -fsS https://api.osv.dev/v1/query -d "{\"package\":{\"name\":\"freerdp\",\"ecosystem\":\"Debian\"},\"version\":\"$pinned\"}" | jq -r '[.vulns[]?.id] | join(", ")')
          echo "pinned=$pinned latest=$latest vulns=$vulns"
          body=""
          [ "$latest" != "$pinned" ] && body="FreeRDP $latest is out; Relaya pins $pinned (core/native/freerdp.version, overrides in core/native/vcpkg.json)."
          [ -n "$vulns" ] && body="$body"$'\n'"OSV for $pinned: $vulns"
          if [ -n "$body" ]; then
            title="FreeRDP: update from $pinned to $latest"
            if ! gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
              gh issue create --title "$title" --label security --body "$body" || gh issue create --title "$title" --body "$body"
            fi
          fi
