name: Core (Rust)

on:
  push:
    branches: ["**"]
    paths: ["core/**", ".github/workflows/core.yml", ".github/actions/**"]
  pull_request:
    paths: ["core/**"]

concurrency:
  group: core-${{ github.ref }}
  # Один прогон на ветку доходит до конца; из новых ждёт только самый свежий (GitHub заменяет ожидающий),
  # так проверка не отменяется частыми пушами, а очередь не копится.
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux — 24.04: toolchain Swift для RoyalVNCKit собран под неё (libxml2.so.2).
        os: [macos-15, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Git identity for sync tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.name ci
          git config --global user.email ci@localhost
      - name: Test
        run: cargo test
      # Т3/Т5: clippy и rustfmt обязательны.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --features remote-desktop -- -D warnings
      - name: Rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      # Встроенный RDP/VNC: Windows и Linux сейчас, Mac — позже; проверяем, что собирается и на darwin.
      # Mac-сборка приложения (build-core-macos.sh, ci.yml) фичу не включает.
      - name: Test with remote-desktop
        run: cargo test --features remote-desktop
      # RDP на FreeRDP: пока только Windows. FreeRDP — из общего кэша или собирается тут же (Т1: без артефактов).
      - name: FreeRDP
        if: runner.os == 'Windows'
        uses: ./.github/actions/freerdp
      - name: Test with rdp-freerdp
        if: runner.os == 'Windows'
        run: cargo test --features rdp-freerdp
      # VNC на RoyalVNCKit: Windows и Linux (на Mac — позже, после того как API устоится).
      - name: RoyalVNCKit
        if: runner.os != 'macOS'
        uses: ./.github/actions/royalvnc
      - name: Test with vnc-royal
        if: runner.os != 'macOS'
        run: cargo test --features vnc-royal
