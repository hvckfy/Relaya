name: Core (Rust)

on:
  push:
    branches: ["**"]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**"]

concurrency:
  group: core-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # На main не отменяем: туда пушат несколько агентов, и у каждого коммита должен быть полный прогон.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Git identity for sync tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.name ci
          git config --global user.email ci@localhost
      - name: Test
        run: cargo test
      # Встроенный RDP/VNC: Windows и Linux сейчас, Mac — позже; проверяем, что собирается и на darwin.
      # Mac-сборка приложения (build-core-macos.sh, ci.yml) фичу не включает.
      - name: Test with remote-desktop
        run: cargo test --features remote-desktop
      # RDP на FreeRDP: пока только Windows; FreeRDP берётся из последнего удачного freerdp.yml на main.
      - name: Fetch FreeRDP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list -R ${{ github.repository }} --workflow freerdp.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId'
          gh run download $run -R ${{ github.repository }} -n freerdp-x64-windows -D "$env:RUNNER_TEMP/freerdp"
          "FREERDP_DIR=$env:RUNNER_TEMP/freerdp".Replace('\','/') | Out-File -Append $env:GITHUB_ENV
          "$env:RUNNER_TEMP/freerdp/bin" | Out-File -Append $env:GITHUB_PATH
      - name: Test with rdp-freerdp
        if: runner.os == 'Windows'
        run: cargo test --features rdp-freerdp
