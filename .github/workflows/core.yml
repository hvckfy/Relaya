name: Core (Rust)

on:
  push:
    branches: ["**"]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**"]

concurrency:
  group: core-${{ github.ref }}
  # Один прогон на ветку: новый push отменяет устаревший (проверяется последний коммит, очередь не копится).
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.toml', 'core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Git identity for sync tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.name ci
          git config --global user.email ci@localhost
      - name: Test
        run: cargo test
      # Т3/Т5: пока как предупреждение — шаг жёлтый, прогон не падает; станут обязательными после чистки.
      - name: Clippy (warning only)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo clippy --all-targets --features remote-desktop -- -D warnings
      - name: Rustfmt (warning only)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo fmt --check
      # Встроенный RDP/VNC: Windows и Linux сейчас, Mac — позже; проверяем, что собирается и на darwin.
      # Mac-сборка приложения (build-core-macos.sh, ci.yml) фичу не включает.
      - name: Test with remote-desktop
        run: cargo test --features remote-desktop
      # RDP на FreeRDP: пока только Windows. FreeRDP — из общего кэша или собирается тут же (Т1: без артефактов).
      - name: FreeRDP
        if: runner.os == 'Windows'
        uses: ./.github/actions/freerdp
      - name: Test with rdp-freerdp
        if: runner.os == 'Windows'
        run: cargo test --features rdp-freerdp
