name: Core (Rust)

# Branches are checked through PRs, main after the fast-forward: one run per push, no push + pull_request duplicate.
on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml", ".github/actions/**"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml", ".github/actions/**"]

concurrency:
  group: core-${{ github.ref }}
  # One run per branch finishes; of the newer ones only the latest waits (GitHub replaces the pending one),
  # so frequent pushes do not cancel the check and the queue does not grow.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: "Core · test on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        # Linux is 24.04: the Swift toolchain for RoyalVNCKit is built for it (libxml2.so.2).
        os: [macos-15, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-test-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml') }}
          restore-keys: core-test-${{ runner.os }}-
      - name: Git identity for sync tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.name ci
          git config --global user.email ci@localhost
      - name: Test
        run: cargo test --locked
      # T3/T5: clippy and rustfmt are required.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets --features remote-desktop -- -D warnings
      - name: Rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      # Built-in RDP/VNC types: check that they build on darwin too.
      # The Mac app build (build-core-macos.sh, mac.yml) enables the engines through FreeRDP and RoyalVNC.
      - name: Test with remote-desktop
        run: cargo test --locked --features remote-desktop
      # RDP on FreeRDP: tested on Windows here. FreeRDP comes from the shared cache or is built here (T1: no artifacts).
      - name: FreeRDP
        if: runner.os == 'Windows'
        uses: ./.github/actions/freerdp
      - name: Test with rdp-freerdp
        if: runner.os == 'Windows'
        run: cargo test --locked --features rdp-freerdp
      # VNC on RoyalVNCKit: tested on Windows and Linux here.
      - name: RoyalVNCKit
        if: runner.os != 'macOS'
        uses: ./.github/actions/royalvnc
      - name: Test with vnc-royal
        if: runner.os != 'macOS'
        run: cargo test --locked --features vnc-royal
