name: Core (Rust)

# Ветки проверяются через PR, main — после fast-forward: один прогон на пуш, без дубля push + pull_request.
on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml", ".github/actions/**"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml", ".github/actions/**"]

concurrency:
  group: core-${{ github.ref }}
  # Один прогон на ветку доходит до конца; из новых ждёт только самый свежий (GitHub заменяет ожидающий),
  # так проверка не отменяется частыми пушами, а очередь не копится.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: "Core · test on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        # Linux — 24.04: toolchain Swift для RoyalVNCKit собран под неё (libxml2.so.2).
        os: [macos-15, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-test-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml') }}
          restore-keys: core-test-${{ runner.os }}-
      - name: Git identity for sync tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.name ci
          git config --global user.email ci@localhost
      - name: Test
        run: cargo test --locked
      # Т3/Т5: clippy и rustfmt обязательны.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets --features remote-desktop -- -D warnings
      - name: Rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      # Встроенный RDP/VNC: Windows и Linux сейчас, Mac — позже; проверяем, что собирается и на darwin.
      # Mac-сборка приложения (build-core-macos.sh, mac.yml) фичу не включает.
      - name: Test with remote-desktop
        run: cargo test --locked --features remote-desktop
      # RDP на FreeRDP: пока только Windows. FreeRDP — из общего кэша или собирается тут же (Т1: без артефактов).
      - name: FreeRDP
        if: runner.os == 'Windows'
        uses: ./.github/actions/freerdp
      - name: Test with rdp-freerdp
        if: runner.os == 'Windows'
        run: cargo test --locked --features rdp-freerdp
      # VNC на RoyalVNCKit: Windows и Linux (на Mac — позже, после того как API устоится).
      - name: RoyalVNCKit
        if: runner.os != 'macOS'
        uses: ./.github/actions/royalvnc
      - name: Test with vnc-royal
        if: runner.os != 'macOS'
        run: cargo test --locked --features vnc-royal
