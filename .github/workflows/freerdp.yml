name: FreeRDP

# Собирает FreeRDP 3 (клиент) через vcpkg и кладёт артефакт для ядра (feature rdp-freerdp).
# Версия закреплена в core/native/vcpkg.json и core/native/freerdp.version; без FFmpeg и OpenH264,
# H.264 на Windows — Media Foundation из ОС.
on:
  push:
    branches: ["**"]
    paths: ["core/native/**", ".github/workflows/freerdp.yml"]
  workflow_dispatch:

concurrency:
  group: freerdp-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg output
        uses: actions/cache@v4
        with:
          path: |
            core/native/vcpkg_installed
            ~/AppData/Local/vcpkg/archives
          key: freerdp-${{ matrix.triplet }}-${{ hashFiles('core/native/vcpkg.json', 'core/native/freerdp.version') }}
      - name: Install FreeRDP
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          git -C $env:VCPKG_INSTALLATION_ROOT fetch -q origin
          git -C $env:VCPKG_INSTALLATION_ROOT checkout -q 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          & $vcpkg install --x-manifest-root=core/native --x-install-root=core/native/vcpkg_installed --triplet ${{ matrix.triplet }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show what was built
        shell: pwsh
        run: |
          $root = "core/native/vcpkg_installed/${{ matrix.triplet }}"
          Get-ChildItem "$root/bin" -Filter *.dll | ForEach-Object { "{0,10:N0}  {1}" -f $_.Length, $_.Name }
          Get-ChildItem "$root/include" -Directory | Select-Object -ExpandProperty Name
      - uses: actions/upload-artifact@v4
        with:
          name: freerdp-${{ matrix.triplet }}
          path: |
            core/native/vcpkg_installed/${{ matrix.triplet }}/bin
            core/native/vcpkg_installed/${{ matrix.triplet }}/lib
            core/native/vcpkg_installed/${{ matrix.triplet }}/include
            core/native/vcpkg_installed/${{ matrix.triplet }}/share/freerdp*
          retention-days: 30
