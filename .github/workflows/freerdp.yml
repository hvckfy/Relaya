name: FreeRDP

# Собирает FreeRDP 3 (клиент) через vcpkg (.github/actions/freerdp — тот же кэш, что у core.yml) и кладёт артефакт.
# Версия закреплена в core/native/vcpkg.json и core/native/freerdp.version; без FFmpeg. H.264 на Windows —
# Media Foundation из ОС, на macOS и Linux — OpenH264 от Cisco, загружаемый по пути (overlay core/native/ports).
on:
  push:
    branches: ["**"]
    paths: ["core/native/**", ".github/workflows/freerdp.yml", ".github/actions/freerdp/**", "scripts/build-core-macos.sh", "scripts/build-core-linux.sh", "core/build.rs", ".github/actions/royalvnc/**"]
  workflow_dispatch:

concurrency:
  group: freerdp-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: "FreeRDP · build ${{ matrix.triplet }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows
          - os: macos-15
            triplet: arm64-osx-dynamic
          - os: macos-15
            triplet: x64-osx-dynamic
          - os: ubuntu-24.04
            triplet: x64-linux-dynamic
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: FreeRDP
        id: freerdp
        uses: ./.github/actions/freerdp
        with:
          triplet: ${{ matrix.triplet }}
      - name: Show what was built
        shell: pwsh
        run: |
          $root = "${{ steps.freerdp.outputs.dir }}"
          $libs = if ($IsWindows) { Get-ChildItem "$root/bin" -Filter *.dll } else { Get-ChildItem "$root/lib" -Include *.dylib, *.so* -Recurse -Depth 0 | Where-Object { -not $_.LinkType } }
          $libs | ForEach-Object { "{0,10:N0}  {1}" -f $_.Length, $_.Name }
          Get-ChildItem "$root/include" -Directory | Select-Object -ExpandProperty Name
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freerdp-${{ matrix.triplet }}
          path: |
            ${{ steps.freerdp.outputs.dir }}/bin
            ${{ steps.freerdp.outputs.dir }}/lib
            ${{ steps.freerdp.outputs.dir }}/include
            ${{ steps.freerdp.outputs.dir }}/share/freerdp*
          retention-days: 90

  # Ядро для Mac с движками FreeRDP и RoyalVNC: обе архитектуры, universal-библиотеки FreeRDP и RoyalVNCKit. Swift-сборку не трогает.
  core-macos:
    name: "FreeRDP · core on Mac"
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: FreeRDP arm64
        id: arm
        uses: ./.github/actions/freerdp
        with:
          triplet: arm64-osx-dynamic
      - name: FreeRDP x86_64
        id: x64
        uses: ./.github/actions/freerdp
        with:
          triplet: x64-osx-dynamic
      - name: RoyalVNCKit
        uses: ./.github/actions/royalvnc
      - name: Build core with rdp-freerdp and vnc-royal
        env:
          FREERDP_DIR_ARM64: ${{ steps.arm.outputs.dir }}
          FREERDP_DIR_X64: ${{ steps.x64.outputs.dir }}
        run: |
          scripts/build-core-macos.sh
          ls -la core/build/freerdp
          lipo -info core/build/librelaya_core.a core/build/freerdp/libRoyalVNCKit.dylib
          grep -c "class RemoteSession\|func rdp(" apps/swift/Sources/RelayaRust/relaya_core.swift

  # Ядро для Linux с движком FreeRDP (и RoyalVNC, как в linux.yml): проверка линковки и привязок C#.
  core-linux:
    name: "FreeRDP · core on Linux"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: FreeRDP
        uses: ./.github/actions/freerdp
        with:
          triplet: x64-linux-dynamic
      - name: Build core with rdp-freerdp
        run: |
          scripts/build-core-linux.sh
          ls -la core/target/release/*.so*
          ldd core/target/release/librelaya_core.so
          if ldd core/target/release/librelaya_core.so | grep -q "not found"; then exit 1; fi
          grep -c "RemoteSupportsH264" apps/dotnet/Relaya.Shared/Core/*.cs
