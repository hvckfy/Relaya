name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Rust core + C# bindings
        shell: pwsh
        run: scripts/build-core-windows.ps1
      # PRI-задачи WinAppSDK есть только в MSBuild из Visual Studio, не в dotnet CLI.
      - uses: microsoft/setup-msbuild@v2
      - name: Build WinUI app
        run: msbuild apps/windows/Relaya.Windows/Relaya.Windows.csproj -restore -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Relaya-windows-x64
          path: apps/windows/Relaya.Windows/bin/x64/Release/
