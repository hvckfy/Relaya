name: Windows

# Ветка main — проверка сборки и артефакт; тег v* — ещё и zip в GitHub Release рядом с Mac-версией.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Только свои файлы: коммит другой платформы не запускает и не отменяет этот прогон (теги — всегда).
    paths:
      - "apps/dotnet/**"
      - "core/**"
      - "resources/**"
      - "scripts/build-core-windows.ps1"
      - ".github/workflows/windows.yml"
  pull_request:

permissions:
  contents: read
  actions: read # артефакт FreeRDP из freerdp.yml

concurrency:
  group: windows-${{ github.ref }}
  # Один прогон на ветку доходит до конца; из новых ждёт только самый свежий (GitHub заменяет ожидающий),
  # так проверка не отменяется частыми пушами, а очередь не копится.
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write  # публикует релиз по тегу
    # Язык интерфейса задаётся при сборке (ADR-002): две сборки, два установщика.
    strategy:
      fail-fast: false
      matrix:
        lang: [ru, en]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      # Встроенный RDP на FreeRDP: артефакт последнего удачного freerdp.yml на main; скрипт ядра соберёт с rdp-freerdp
      # и положит DLL FreeRDP рядом с relaya_core.dll.
      - name: Fetch FreeRDP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list -R ${{ github.repository }} --workflow freerdp.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId'
          gh run download $run -R ${{ github.repository }} -n freerdp-x64-windows -D "$env:RUNNER_TEMP/freerdp"
          "FREERDP_DIR=$env:RUNNER_TEMP/freerdp".Replace('\','/') | Out-File -Append $env:GITHUB_ENV
      # VNC на RoyalVNCKit: закреплённый коммит, кэш; скрипт ядра включит vnc-royal и положит DLL рядом.
      - name: RoyalVNCKit
        uses: ./.github/actions/royalvnc
      # Unit-тесты чистой логики Shared (Т4) — без ядра и WinUI, до долгой сборки.
      - name: Shared unit tests
        shell: pwsh
        run: dotnet test apps/dotnet/Relaya.Shared.Tests -c Release
      - name: Build Rust core + C# bindings
        shell: pwsh
        run: scripts/build-core-windows.ps1
      # ConPTY: вывод процесса доходит до подписчика (регрессия «чёрная вкладка, код 255»).
      # sshd в раннере для smoke-теста: вход по ключу на localhost. Не поднялся — ssh-часть теста пропускается.
      - name: Start local sshd for smoke test
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) { Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null }
          $key = "$env:RUNNER_TEMP\relaya_smoke_key"
          ssh-keygen -q -t ed25519 -N "" -f $key
          $auth = "$env:ProgramData\ssh\administrators_authorized_keys"
          New-Item -ItemType Directory -Force "$env:ProgramData\ssh" | Out-Null
          $locked = "$env:RUNNER_TEMP\\relaya_smoke_key_pass"
          ssh-keygen -q -t ed25519 -N "relaya-smoke-pass" -f $locked
          Get-Content "$key.pub", "$locked.pub" | Set-Content -Encoding ascii $auth
          icacls $auth /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F" | Out-Null
          Start-Service sshd
          "RELAYA_SMOKE_SSH_KEY=$key" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "RELAYA_SMOKE_SSH_KEY_PASS=$locked" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # Терминал как в приложении: WinExe без консоли, ConPTY, эмулятор ядра, ввод, Resize, ssh.
      - name: Terminal smoke test
        shell: pwsh
        run: |
          dotnet build apps/dotnet/Relaya.Windows.Smoke -c Release -o build/smoke
          $log = "$env:RUNNER_TEMP\smoke.log"
          $p = Start-Process build/smoke/Relaya.Windows.Smoke.exe -ArgumentList "`"$log`"" -Wait -PassThru
          Get-Content $log
          exit $p.ExitCode
      # PRI-задачи WinAppSDK есть только в MSBuild из Visual Studio, не в dotnet CLI.
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Build WinUI app
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          msbuild apps/dotnet/Relaya.Windows/Relaya.Windows.csproj -restore -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:Version=$version -p:RelayaLang=${{ matrix.lang }}
      # Установщик (Inno Setup есть на образе windows-latest; если нет — ставим через choco).
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=$version /DRelayaLang=${{ matrix.lang }} apps/dotnet/installer/Relaya.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Relaya-windows-x64-${{ matrix.lang }}
          path: |
            apps/dotnet/Relaya.Windows/bin/x64/Release/
            build/Relaya-*-${{ matrix.lang }}-setup.exe
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Relaya-$env:GITHUB_REF_NAME-windows-x64-${{ matrix.lang }}.zip"
          Compress-Archive -Path apps/dotnet/Relaya.Windows/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/* -DestinationPath $zip
          # Две сборки (ru, en) идут параллельно: релиз мог создать соседний job — тогда create падает, и это нормально.
          gh release view $env:GITHUB_REF_NAME 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --generate-notes 2>$null; Start-Sleep 5 }
          gh release upload $env:GITHUB_REF_NAME $zip (Get-Item build/Relaya-*-${{ matrix.lang }}-setup.exe).FullName --clobber
      # Настоящий TerminalView (WinUI + Win2D): Feed из фонового потока, проверка отрисованного кадра.
      - name: Terminal view selftest
        shell: pwsh
        run: |
          # Отдельная сборка с RELAYA_SELFTEST — в самом конце, после артефактов: в релиз этот режим не попадает.
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          msbuild apps/dotnet/Relaya.Windows/Relaya.Windows.csproj -restore -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:Version=$version -p:RelayaLang=${{ matrix.lang }} -p:RelayaSelftest=true
          $exe = Get-ChildItem apps/dotnet/Relaya.Windows/bin/x64/Release -Recurse -Filter Relaya.exe | Select-Object -First 1
          $log = "$env:RUNNER_TEMP\selftest.log"
          $p = Start-Process $exe.FullName -ArgumentList "--selftest-terminal", $log -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "selftest: timeout" }
          if (Test-Path $log) { Get-Content $log } else { Write-Host "no selftest log" }
          $tl = "$env:APPDATA\Relaya\terminal.log"
          if (Test-Path $tl) { Get-Content $tl }
          if ($p.HasExited -and $p.ExitCode -eq 0) { exit 0 }
          Write-Host "::error::Terminal view selftest failed (see terminal.log above)"
          exit 1
