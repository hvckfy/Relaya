name: Windows

# Ветка main — проверка сборки и артефакт; тег v* — ещё и zip в GitHub Release рядом с Mac-версией.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Rust core + C# bindings
        shell: pwsh
        run: scripts/build-core-windows.ps1
      # PRI-задачи WinAppSDK есть только в MSBuild из Visual Studio, не в dotnet CLI.
      - uses: microsoft/setup-msbuild@v2
      - name: Build WinUI app
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          msbuild apps/dotnet/Relaya.Windows/Relaya.Windows.csproj -restore -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:Version=$version
      - uses: actions/upload-artifact@v4
        with:
          name: Relaya-windows-x64
          path: apps/dotnet/Relaya.Windows/bin/x64/Release/
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Relaya-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path apps/dotnet/Relaya.Windows/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/* -DestinationPath $zip
          gh release view $env:GITHUB_REF_NAME 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --generate-notes }
          gh release upload $env:GITHUB_REF_NAME $zip --clobber
