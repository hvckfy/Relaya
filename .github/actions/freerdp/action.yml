name: FreeRDP
description: >
  FreeRDP 3 (клиент) через vcpkg для ядра (feature rdp-freerdp): кэш по core/native/vcpkg.json и freerdp.version,
  при промахе — сборка (~15 минут). Не зависит от артефактов других workflow.
inputs:
  triplet:
    description: vcpkg triplet (x64-windows; на macOS — arm64-osx-dynamic / x64-osx-dynamic, на Linux — x64-linux-dynamic; ядро линкует dylib и .so)
    default: x64-windows
outputs:
  dir:
    description: каталог с include/, lib/ и bin/
    value: ${{ steps.dir.outputs.dir }}
runs:
  using: composite
  steps:
    - name: Cache FreeRDP
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # Только свой triplet: два triplet в одном install-root — второй vcpkg install удаляет пакеты первого.
        path: core/native/vcpkg_installed/${{ inputs.triplet }}
        key: freerdp-${{ inputs.triplet }}-${{ hashFiles('core/native/vcpkg.json', 'core/native/freerdp.version', 'core/native/ports/**', 'core/native/openh264/**') }}
    - name: Build FreeRDP
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $baseline = (Get-Content core/native/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
        # На Windows vcpkg есть в образе; на macOS — клон по закреплённому baseline.
        if (-not $env:VCPKG_INSTALLATION_ROOT -or -not (Test-Path $env:VCPKG_INSTALLATION_ROOT)) {
          $env:VCPKG_INSTALLATION_ROOT = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone -q https://github.com/microsoft/vcpkg $env:VCPKG_INSTALLATION_ROOT
          git -C $env:VCPKG_INSTALLATION_ROOT checkout -q $baseline
          & (Join-Path $env:VCPKG_INSTALLATION_ROOT "bootstrap-vcpkg.sh") -disableMetrics
        } else {
          git -C $env:VCPKG_INSTALLATION_ROOT fetch -q origin
          git -C $env:VCPKG_INSTALLATION_ROOT checkout -q $baseline
        }
        $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT ($IsWindows ? "vcpkg.exe" : "vcpkg")
        # Свой install-root на triplet (manifest-режим убирает из root всё, что не этот triplet), потом — на общее место.
        $root = Join-Path $env:RUNNER_TEMP "vcpkg-root-${{ inputs.triplet }}"
        & $vcpkg install --x-manifest-root=core/native --x-install-root=$root --overlay-ports=core/native/ports --triplet ${{ inputs.triplet }}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        New-Item -ItemType Directory -Force core/native/vcpkg_installed | Out-Null
        Move-Item (Join-Path $root "${{ inputs.triplet }}") "core/native/vcpkg_installed/${{ inputs.triplet }}"
    - name: Export FREERDP_DIR
      id: dir
      shell: pwsh
      run: |
        $dir = (Resolve-Path "core/native/vcpkg_installed/${{ inputs.triplet }}").Path.Replace('\','/')
        "dir=$dir" | Out-File -Append $env:GITHUB_OUTPUT
        "FREERDP_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
        if ($IsWindows) { "$dir/bin" | Out-File -Append $env:GITHUB_PATH }
