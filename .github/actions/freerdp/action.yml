name: FreeRDP
description: >
  The FreeRDP 3 client through vcpkg for the core (feature rdp-freerdp): cached by core/native/vcpkg.json and
  freerdp.version, built on a miss (~15 minutes). Does not depend on other workflows' artifacts.
inputs:
  triplet:
    description: vcpkg triplet (x64-windows; arm64-osx-dynamic / x64-osx-dynamic on macOS, x64-linux-dynamic on Linux; the core links the dylib and .so)
    default: x64-windows
outputs:
  dir:
    description: folder with include/, lib/ and bin/
    value: ${{ steps.dir.outputs.dir }}
runs:
  using: composite
  steps:
    - name: Cache FreeRDP
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # A folder per triplet: vcpkg in manifest mode removes other triplets' packages from install-root,
        # and on macOS the x86_64 build erased arm64 (without the cache: no winpr/crt.h).
        path: core/native/vcpkg_installed/${{ inputs.triplet }}.root
        key: freerdp-${{ inputs.triplet }}-${{ hashFiles('core/native/vcpkg.json', 'core/native/freerdp.version', 'core/native/ports/**', 'core/native/openh264/**') }}
    - name: Build FreeRDP
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $baseline = (Get-Content core/native/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
        # On Windows vcpkg is on the image; on macOS it is cloned at the pinned baseline.
        if (-not $env:VCPKG_INSTALLATION_ROOT -or -not (Test-Path $env:VCPKG_INSTALLATION_ROOT)) {
          $env:VCPKG_INSTALLATION_ROOT = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone -q https://github.com/microsoft/vcpkg $env:VCPKG_INSTALLATION_ROOT
          git -C $env:VCPKG_INSTALLATION_ROOT checkout -q $baseline
          & (Join-Path $env:VCPKG_INSTALLATION_ROOT "bootstrap-vcpkg.sh") -disableMetrics
        } else {
          git -C $env:VCPKG_INSTALLATION_ROOT fetch -q origin
          git -C $env:VCPKG_INSTALLATION_ROOT checkout -q $baseline
        }
        $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT ($IsWindows ? "vcpkg.exe" : "vcpkg")
        & $vcpkg install --x-manifest-root=core/native --x-install-root=core/native/vcpkg_installed/${{ inputs.triplet }}.root --overlay-ports=core/native/ports --triplet ${{ inputs.triplet }}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Export FREERDP_DIR
      id: dir
      shell: pwsh
      run: |
        $dir = (Resolve-Path "core/native/vcpkg_installed/${{ inputs.triplet }}.root/${{ inputs.triplet }}").Path.Replace('\','/')
        "dir=$dir" | Out-File -Append $env:GITHUB_OUTPUT
        "FREERDP_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
        if ($IsWindows) { "$dir/bin" | Out-File -Append $env:GITHUB_PATH }
