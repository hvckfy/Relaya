name: RoyalVNCKit
description: >
  RoyalVNCKit (MIT) with a C API for the core (feature vnc-royal), pinned commit: one .so with -static-stdlib on
  Linux, a dll plus the Swift runtime in PATH on Windows, a universal dylib (arm64 and x86_64, minos 15) built with
  Xcode's Swift on macOS (the runtime is in the OS). Cached by commit and Swift version.
inputs:
  commit:
    description: royalapplications/royalvnc commit (its Package.resolved pins CryptoSwift a59b4d9 and Cstb 1.0.6)
    default: 090b96eddeee183e9fec293c5cd881d302a4349d
  swift:
    description: Swift version
    default: "6.2.4"
  swift-sha256:
    description: sha256 of the Linux toolchain archive for that version (print it with swift-pin.yml)
    default: 15608c4fa0364ef906014343d81639cf58169e8a40de2b2d3503c3f35a8bb66d
outputs:
  dir:
    description: folder with the RoyalVNCKit library
    value: ${{ steps.dir.outputs.dir }}
runs:
  using: composite
  steps:
    - name: Swift dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq binutils libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libpython3-dev \
          libsqlite3-0 libstdc++-13-dev libxml2-dev libncurses-dev libz3-dev pkg-config zlib1g-dev >/dev/null
    - name: Cache Swift (Linux)
      if: runner.os == 'Linux'
      id: swiftcache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/swift-toolchain
        key: swift-${{ inputs.swift }}-${{ runner.os }}-ubuntu24.04
    - name: Swift (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        tag="swift-${{ inputs.swift }}-RELEASE"
        if [ ! -x ~/swift-toolchain/usr/bin/swift ]; then
          mkdir -p ~/swift-toolchain
          # Pinned hash, fail-closed, like actionlint and appimagetool.
          curl -fsSL -o "$RUNNER_TEMP/swift.tar.gz" \
            "https://download.swift.org/swift-${{ inputs.swift }}-release/ubuntu2404/$tag/$tag-ubuntu24.04.tar.gz"
          echo "${{ inputs.swift-sha256 }}  $RUNNER_TEMP/swift.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/swift.tar.gz" -C ~/swift-toolchain --strip-components=1
          rm "$RUNNER_TEMP/swift.tar.gz"
        fi
        echo "$HOME/swift-toolchain/usr/bin" >> "$GITHUB_PATH"
    - uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557 # v6
      if: runner.os == 'Windows'
    - uses: compnerd/gha-setup-swift@581df1ffa3f3e786ddc73ff37364ee231f9644c5 # v0.3.0
      if: runner.os == 'Windows'
      with:
        branch: swift-${{ inputs.swift }}-release
        tag: ${{ inputs.swift }}-RELEASE
    # On macOS Swift comes from Xcode: its version is part of the cache key, so a new image rebuilds the dylib.
    - name: Toolchain id
      id: toolchain
      shell: bash
      run: |
        if [ "$RUNNER_OS" = macOS ]; then id=$(xcodebuild -version | tr -s ' \n' '-'); else id=${{ inputs.swift }}; fi
        echo "id=$id" >> "$GITHUB_OUTPUT"
    - name: Cache RoyalVNCKit
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/royalvnc-out
        key: royalvnc-${{ inputs.commit }}-swift-${{ steps.toolchain.outputs.id }}-${{ runner.os }}-macos15
    - name: Build RoyalVNCKit
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $src = Join-Path $env:RUNNER_TEMP "royalvnc"
        $out = Join-Path $env:RUNNER_TEMP "royalvnc-out"
        git init -q $src
        git -C $src fetch -q --depth 1 https://github.com/royalapplications/royalvnc ${{ inputs.commit }}
        git -C $src checkout -q FETCH_HEAD
        Push-Location $src
        if ($IsLinux) {
          swift build -c release --product RoyalVNCKit -Xswiftc -static-stdlib
        } elseif ($IsMacOS) {
          # minos comes from the manifest platforms (macOS 11 there), not from --triple: raise it to 15 (Relaya's minimum).
          $manifest = Get-Content Package.swift -Raw
          if ($manifest -notmatch '\.macOS\(\.v11\)') { Write-Error "Package.swift: .macOS(.v11) not found"; exit 1 }
          $manifest.Replace('.macOS(.v11)', '.macOS(.v15)') | Set-Content Package.swift -NoNewline
          # One architecture at a time, then lipo into one dylib.
          foreach ($arch in "arm64", "x86_64") {
            swift build -c release --product RoyalVNCKit --triple "$arch-apple-macosx15.0"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        } else {
          swift build -c release --product RoyalVNCKit
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Pop-Location
        New-Item -ItemType Directory -Force $out | Out-Null
        if ($IsMacOS) {
          lipo -create "$src/.build/arm64-apple-macosx/release/libRoyalVNCKit.dylib" `
            "$src/.build/x86_64-apple-macosx/release/libRoyalVNCKit.dylib" -output "$out/libRoyalVNCKit.dylib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lipo -info "$out/libRoyalVNCKit.dylib"
          $minos = otool -l "$out/libRoyalVNCKit.dylib" | Select-String 'minos' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          $minos
          if ($minos -ne 'minos 15.0') { Write-Error "RoyalVNCKit minos is not 15.0"; exit 1 }
          otool -D "$out/libRoyalVNCKit.dylib"
        }
        Get-ChildItem "$src/.build/release" -File | Where-Object { $_.Name -match '^(lib)?RoyalVNCKit\.(so|dll|lib)$' } |
          Copy-Item -Destination $out
        Get-ChildItem $out | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name }
    - name: Export ROYALVNC_DIR
      id: dir
      shell: pwsh
      run: |
        $dir = (Join-Path $env:RUNNER_TEMP "royalvnc-out").Replace('\','/')
        "dir=$dir" | Out-File -Append $env:GITHUB_OUTPUT
        "ROYALVNC_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
        if ($IsWindows) { $dir | Out-File -Append $env:GITHUB_PATH }
        elseif ($IsMacOS) { "DYLD_LIBRARY_PATH=$dir" | Out-File -Append $env:GITHUB_ENV }
        else { "LD_LIBRARY_PATH=$dir" | Out-File -Append $env:GITHUB_ENV }
