name: Build core
description: Restores the cargo cache and runs the platform core build script (Rust core + UniFFI bindings).
inputs:
  script:
    description: Build script path relative to the repository root.
    required: true
runs:
  using: composite
  steps:
    # One cache per OS and CPU; the key follows Cargo.lock and the pinned toolchain.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/uniffi-bindgen-cs*
          core/target
        key: core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml') }}
        restore-keys: core-${{ runner.os }}-${{ runner.arch }}-
    # Windows runs the PowerShell script in pwsh: Git Bash puts its own `link` before MSVC link.exe on PATH.
    - name: Build Rust core + bindings
      if: runner.os == 'Windows'
      shell: pwsh
      run: '& "${{ inputs.script }}"'
    - name: Build Rust core + bindings
      if: runner.os != 'Windows'
      shell: bash
      run: '"${{ inputs.script }}"'
