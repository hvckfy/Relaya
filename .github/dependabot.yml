# Weekly dependency updates, grouped so each ecosystem opens at most one PR.
# No Swift entry: the package needs the core xcframework that only build-core-macos.sh produces, so Dependabot
# cannot resolve it; SwiftTerm is updated by hand.
version: 2
updates:
  # Composite actions are not covered by "/" (only workflows and a root action.yml), so list them too.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/build-core", "/.github/actions/freerdp", "/.github/actions/royalvnc"]
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: cargo
    directory: /core
    schedule: { interval: weekly }
    groups: { cargo: { patterns: ["*"] } }
  - package-ecosystem: nuget
    directory: /apps/dotnet
    schedule: { interval: weekly }
    groups: { nuget: { patterns: ["*"] } }
